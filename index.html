<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>키오스크 슬라이더</title>
    
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        
        .swiper {
            width: 100vw;
            height: 100vh;
        }
        
        .swiper-slide {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000;
        }
        
        .swiper-slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .swiper-slide video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        /* 우측 하단 몽실이 → 쉼표 아케이드(게임) */
        .play {
            position: fixed;
            right: 3vmin;
            bottom: 3vmin;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: .4vmin;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }
        .play .face {
            width: clamp(68px, 12vmin, 140px);
            height: clamp(68px, 12vmin, 140px);
            display: grid;
            place-items: center;
            background: #FFF6DE;
            border: 3px solid #2E2A4F;
            border-radius: 50%;
            box-shadow: 0 4px 0 #2E2A4F, 0 8px 18px rgba(0, 0, 0, .45);
            animation: bob 2.4s ease-in-out infinite;
        }
        .play .face svg { width: 78%; height: 78%; }
        .play .label {
            padding: .3em .9em;
            font: 700 clamp(14px, 2.3vmin, 25px)/1.2 'Jua', 'Malgun Gothic', sans-serif;
            color: #2E2A4F;
            background: #FFD66B;
            border: 3px solid #2E2A4F;
            border-radius: 999px;
            white-space: nowrap;
        }
        .play:active .face { transform: translateY(5px); box-shadow: 0 1px 0 #2E2A4F; animation: none; }
        @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    </style>
</head>
<body>
    <!-- Swiper -->
    <div class="swiper">
        <div class="swiper-wrapper" id="swiper-wrapper">
            <!-- 슬라이드가 동적으로 생성됩니다 -->
        </div>
    </div>

    <!-- 몽실이를 누르면 쉼표 아케이드로 -->
    <a class="play" href="https://shimpyo-arcade.pages.dev/" aria-label="쉼표 아케이드 게임하러 가기">
        <span class="face"><svg viewBox="0 0 120 120" aria-hidden="true"><path d="M60 22c5-12 16-16 24-12-4 8-13 13-24 12z" fill="#7FD8BE" stroke="#2E2A4F" stroke-width="3.5" stroke-linejoin="round"/><path d="M60 22C94 22 112 46 112 72C112 98 90 112 60 112C30 112 8 98 8 72C8 46 26 22 60 22Z" fill="#fff" stroke="#2E2A4F" stroke-width="4"/><ellipse cx="32" cy="80" rx="9" ry="6" fill="#FFB8B0"/><ellipse cx="88" cy="80" rx="9" ry="6" fill="#FFB8B0"/><path d="M38 70q6-8 12 0M70 70q6-8 12 0" stroke="#2E2A4F" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M53 82q7 8 14 0" stroke="#2E2A4F" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg></span>
        <span class="label">게임하기</span>
    </a>

    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    
    <script>
        // 지원하는 파일 확장자
        const imageTypes = ['jpg', 'jpeg', 'png', 'gif', 'webp'];
        const videoTypes = ['mp4', 'webm', 'ogg'];
        
        // 파일 타입 확인 함수
        function getFileType(extension) {
            const ext = extension.toLowerCase();
            if (imageTypes.includes(ext)) {
                return 'image';
            } else if (videoTypes.includes(ext)) {
                return 'video';
            }
            return 'unknown';
        }
        
        // 파일 존재 여부 확인 함수 (이미지)
        function checkImageExists(filePath) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = filePath;
            });
        }
        
        // 파일 존재 여부 확인 함수 (영상)
        function checkVideoExists(filePath) {
            return new Promise((resolve) => {
                const video = document.createElement('video');
                video.oncanplay = () => {
                    resolve(true);
                    video.src = '';
                };
                video.onerror = () => resolve(false);
                video.src = filePath;
                video.load();
            });
        }
        
        // 슬라이드 생성 함수
        async function createSlides() {
            const wrapper = document.getElementById('swiper-wrapper');
            wrapper.replaceChildren(); // 다시 만들 때 예전 슬라이드가 쌓이지 않게
            const slides = [];
            
            // 01부터 10까지 파일 확인
            for (let i = 1; i <= 10; i++) {
                const num = String(i).padStart(2, '0');
                let foundFile = null;
                let fileType = null;
                
                // 이미지 확장자 먼저 확인
                for (const ext of imageTypes) {
                    const filePath = `upload/${num}.${ext}`;
                    const exists = await checkImageExists(filePath);
                    if (exists) {
                        foundFile = filePath;
                        fileType = 'image';
                        break;
                    }
                }
                
                // 이미지를 찾지 못했으면 영상 확장자 확인
                if (!foundFile) {
                    for (const ext of videoTypes) {
                        const filePath = `upload/${num}.${ext}`;
                        const exists = await checkVideoExists(filePath);
                        if (exists) {
                            foundFile = filePath;
                            fileType = 'video';
                            break;
                        }
                    }
                }
                
                // 파일을 찾았으면 슬라이드 생성
                if (foundFile) {
                    const slide = document.createElement('div');
                    slide.className = 'swiper-slide';
                    
                    if (fileType === 'image') {
                        slide.innerHTML = `<img src="${foundFile}" alt="Slide ${num}">`;
                    } else if (fileType === 'video') {
                        slide.innerHTML = `<video src="${foundFile}" muted playsinline></video>`;
                    }
                    
                    wrapper.appendChild(slide);
                    slides.push({ file: foundFile, type: fileType });
                }
            }
            
            return slides;
        }
        
        // Swiper 초기화 및 시작
        let swiper;
        let previousVideo = null; // 이전 영상 참조 저장
        let totalSlideCount = 0; // 전체 슬라이드 개수
        let repeatCount = 0; // 전체 반복 회수 (회전수)
        let previousRealIndex = -1; // 이전 realIndex 추적
        let nextTimer = null; // 다음 슬라이드로 넘기는 타이머 (이미지 12초 / 영상 안전장치)
        const IMAGE_DELAY = 12000;
        
        async function initSwiper() {
            const slides = await createSlides();
            
            if (slides.length === 0) {
                console.warn('슬라이드할 파일이 없습니다.');
                return;
            }
            
            // 전체 슬라이드 개수 저장
            totalSlideCount = slides.length;
            // 반복 카운터 초기화
            repeatCount = 0;
            previousRealIndex = -1;
            
            // Swiper 초기화
            swiper = new Swiper('.swiper', {
                effect: 'fade',
                fadeEffect: {
                    crossFade: true
                },
                loop: slides.length > 1, // 슬라이드가 2개 이상일 때만 loop 활성화
                speed: 2000,
                allowTouchMove: false,
                // 자동 넘김은 Swiper autoplay 대신 setupSlideAutoplay의 타이머가 맡아요.
                // (autoplay를 쓰면 반복 2바퀴째부터 영상이 12초에 잘렸어요)
                on: {
                    init: function() {
                        // 초기 슬라이드 인덱스 기록
                        previousRealIndex = this.realIndex;
                    },
                    slideChange: function() {
                        const currentRealIndex = this.realIndex;
                        
                        // 마지막 슬라이드에서 첫 번째 슬라이드로 돌아왔을 때 (한 바퀴 완료)
                        // previousRealIndex가 마지막 인덱스이고, currentRealIndex가 0이면 한 바퀴 완료
                        if (previousRealIndex === totalSlideCount - 1 && currentRealIndex === 0) {
                            repeatCount++;
                            
                            // 3회 반복(회전) 이상이면 초기화
                            if (repeatCount >= 3) {
                                resetSwiper();
                                return;
                            }
                        }
                        
                        // 이전 인덱스 업데이트
                        previousRealIndex = currentRealIndex;
                        
                        setupSlideAutoplay(this);
                    }
                }
            });
            
            // 초기 설정
            setupSlideAutoplay(swiper);
        }
        
        // 다음 슬라이드로 넘기기 예약
        function scheduleNext(swiperInstance, ms) {
            clearTimeout(nextTimer);
            nextTimer = setTimeout(() => {
                if (swiper === swiperInstance) swiperInstance.slideNext();
            }, ms);
        }

        // 슬라이드별 자동 넘김 설정: 이미지는 12초, 영상은 끝날 때
        function setupSlideAutoplay(swiperInstance) {
            clearTimeout(nextTimer);

            // 이전 영상 정리
            if (previousVideo) {
                previousVideo.onended = null;
                previousVideo.pause();
                previousVideo.currentTime = 0;
                previousVideo = null;
            }

            // 현재 활성 슬라이드 찾기 - activeIndex를 직접 사용 (가장 안전한 방법)
            const currentSlide = swiperInstance.slides[swiperInstance.activeIndex];
            if (!currentSlide || !currentSlide.querySelector) {
                console.warn('슬라이드를 찾을 수 없습니다. activeIndex:', swiperInstance.activeIndex);
                scheduleNext(swiperInstance, IMAGE_DELAY);
                return;
            }

            const video = currentSlide.querySelector('video');

            // 이미지: 12초 뒤 다음으로
            if (!video) {
                scheduleNext(swiperInstance, IMAGE_DELAY);
                return;
            }

            // 영상: 처음부터 재생하고, 끝나면 다음으로
            previousVideo = video;
            video.onended = () => {
                if (video === previousVideo) scheduleNext(swiperInstance, 0);
            };
            video.currentTime = 0;
            const playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.catch(e => {
                    console.error('영상 재생 실패:', e);
                    // 재생 실패 시 3초 후 다음 슬라이드로
                    if (video === previousVideo) scheduleNext(swiperInstance, 3000);
                });
            }
            // 안전장치: 영상이 멈춰서 끝나지 않아도 길이 + 5초 뒤에는 넘어가요
            const guard = () => {
                if (video === previousVideo && isFinite(video.duration)) {
                    scheduleNext(swiperInstance, (video.duration + 5) * 1000);
                }
            };
            if (video.readyState >= 1) guard();
            else video.addEventListener('loadedmetadata', guard, { once: true });
        }

        // Swiper 초기화 함수 (3회 주기마다 호출)
        async function resetSwiper() {
            clearTimeout(nextTimer);
            // 모든 비디오 정리 (재생 중이어도 강제 중지)
            if (previousVideo) {
                previousVideo.onended = null;
                previousVideo.onerror = null;
                previousVideo.pause();
                previousVideo.currentTime = 0;
                previousVideo = null;
            }
            
            // 모든 슬라이드의 비디오 정리
            const allVideos = document.querySelectorAll('.swiper-slide video');
            allVideos.forEach(video => {
                video.onended = null;
                video.onerror = null;
                video.pause();
                video.currentTime = 0;
            });
            
            // Swiper 인스턴스 제거
            if (swiper) {
                swiper.destroy(true, true);
                swiper = null;
            }
            
            // 반복 카운터 리셋
            repeatCount = 0;
            previousRealIndex = -1;
            
            // Swiper 재초기화
            await initSwiper();
        }
        
        // 초기화 실행
        initSwiper();
    </script>
</body>
</html>
